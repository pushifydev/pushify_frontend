name: CI

# The default branch is master (these filters said main, so CI never ran on a PR or merge);
# release branches are where the work lands first.
on:
  push:
    branches: [master, main, 'release/**']
  pull_request:
    branches: [master, main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

  # `secrets` can't be read in a job-level `if` (it made this whole workflow invalid), so a
  # tiny job reports whether the dashboard credentials exist.
  e2e-credentials:
    name: Dashboard E2E credentials present?
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ -n "$E2E_EMAIL" ] && [ -n "$E2E_PASSWORD" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  e2e-dashboard:
    name: E2E Dashboard (staging credentials)
    runs-on: ubuntu-latest
    needs: [build, e2e-credentials]
    if: needs.e2e-credentials.outputs.present == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.E2E_API_URL || 'https://api.pushify.dev/api/v1' }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/dashboard-billing.spec.ts e2e/dashboard-server.spec.ts
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://pushify.dev' }}
          NEXT_PUBLIC_API_URL: ${{ vars.E2E_API_URL || 'https://api.pushify.dev/api/v1' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_SERVER_ID: ${{ secrets.E2E_SERVER_ID }}
